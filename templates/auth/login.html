{% extends 'auth/auth_base.html' %}
{% set auth_title = 'Sign In' %}
{% block auth_content %}
<h2 style="font-size: 1.25rem; margin-bottom: 20px;">Sign in to your workspace</h2>

{% if error %}
<div class="auth-error"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>
{% endif %}

<form method="POST" action="{{ url_for('auth.do_login') }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required autofocus>
    </div>
    <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required>
    </div>
    <button type="submit" class="btn btn--primary w-100 fw-bold mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
    </button>
</form>

<div class="auth-footer-link">
    New company? <a href="{{ url_for('auth.register') }}">Register your operation</a>
</div>
{% endblock %}
